<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a2a3b" />
    <title>The Shell – Kitchen Stock</title>
    <style>
      :root {
        --bg: #f2f5fb;
        --card: #fff;
        --tx: #141b2b;
        --mu: #6c7589;
        --br: #e3e8f1;
        --pr: #3366ff;
        --prs: #e8eeff;
        --ok: #16a870;
        --oks: #e3f7ee;
        --wa: #e8590c;
        --was: #fff0e6;
        --rd: #d6334a;
        --rds: #ffe8ec;
        --hd1: #1f3864;
        --hd2: #3a5bc7;
        --sh: 0 2px 10px #1b2a5014;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1320;
          --card: #182033;
          --tx: #e9eef8;
          --mu: #94a0b8;
          --br: #273049;
          --pr: #6c92ff;
          --prs: #202c52;
          --ok: #3ecf95;
          --oks: #143327;
          --wa: #ff8a4c;
          --was: #3a2416;
          --rd: #ff6b82;
          --rds: #3b1b24;
          --hd1: #13203d;
          --hd2: #25408f;
          --sh: none;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1320;
        --card: #182033;
        --tx: #e9eef8;
        --mu: #94a0b8;
        --br: #273049;
        --pr: #6c92ff;
        --prs: #202c52;
        --ok: #3ecf95;
        --oks: #143327;
        --wa: #ff8a4c;
        --was: #3a2416;
        --rd: #ff6b82;
        --rds: #3b1b24;
        --hd1: #13203d;
        --hd2: #25408f;
        --sh: none;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      [hidden] {
        display: none !important;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: var(--tx);
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
      }
      input,
      select,
      textarea {
        background: var(--bg);
        border: 1.5px solid var(--br);
        border-radius: 12px;
        padding: 10px 12px;
        width: 100%;
        outline: none;
      }
      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--pr);
      }
      .hero {
        background: linear-gradient(135deg, var(--hd1), var(--hd2));
        color: #fff;
        padding: 16px 16px 22px;
        border-radius: 0 0 26px 26px;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
      }
      .r {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sp {
        flex: 1;
      }
      .av {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #ffffff2e;
        display: grid;
        place-items: center;
        font-weight: 700;
      }
      .hi {
        font-size: 13px;
        opacity: 0.85;
      }
      .big {
        font-size: 20px;
        font-weight: 750;
      }
      .ib {
        background: #ffffff26;
        color: #fff;
        border-radius: 12px;
        width: 40px;
        height: 40px;
        font-size: 18px;
      }
      .prog {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 16px;
      }
      .ring {
        --p: 0;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: conic-gradient(#ffd43b calc(var(--p) * 1%), #ffffff30 0);
        display: grid;
        place-items: center;
        transition: 0.4s;
        flex: none;
      }
      .ring b {
        width: 66px;
        height: 66px;
        border-radius: 50%;
        background: var(--hd1);
        display: grid;
        place-items: center;
        font-size: 19px;
      }
      .pl {
        font-size: 13px;
        line-height: 1.6;
      }
      .pl strong {
        font-size: 16px;
      }
      .dt {
        background: #ffffff26;
        border: 0;
        color: #fff;
        border-radius: 12px;
        padding: 8px 10px;
        width: auto;
        color-scheme: dark;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 14px 14px 80px;
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 2px 0 10px;
        scrollbar-width: none;
      }
      .chip {
        flex: none;
        padding: 7px 14px;
        border-radius: 20px;
        background: var(--card);
        border: 1.5px solid var(--br);
        font-size: 14px;
        font-weight: 600;
        color: var(--mu);
      }
      .chip.on {
        background: var(--pr);
        border-color: var(--pr);
        color: #fff;
      }
      .tools {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .card {
        background: var(--card);
        border-radius: 18px;
        padding: 14px;
        margin-bottom: 10px;
        box-shadow: var(--sh);
        border: 2px solid transparent;
        transition: 0.2s;
      }
      .card.done {
        border-color: var(--ok);
        background: linear-gradient(var(--oks), var(--card) 70%);
      }
      .ic {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: var(--prs);
        display: grid;
        place-items: center;
        font-size: 22px;
        flex: none;
      }
      .nm {
        font-weight: 700;
        font-size: 16px;
      }
      .sub {
        font-size: 12px;
        color: var(--mu);
      }
      .tick {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 2.5px solid var(--br);
        font-size: 22px;
        color: transparent;
        flex: none;
        transition: 0.2s;
      }
      .done .tick {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
        transform: scale(1.06);
      }
      .q2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }
      .lb {
        font-size: 11px;
        font-weight: 600;
        color: var(--mu);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .st {
        display: flex;
        align-items: center;
        background: var(--bg);
        border-radius: 13px;
        border: 1.5px solid var(--br);
      }
      .st button {
        width: 40px;
        height: 44px;
        font-size: 22px;
        color: var(--pr);
        font-weight: 700;
      }
      .st input {
        border: 0;
        background: none;
        text-align: center;
        padding: 0;
        font-weight: 700;
        font-size: 18px;
        min-width: 0;
      }
      .un {
        flex: none;
        font-size: 12px;
        font-weight: 700;
        color: var(--pr);
        padding: 7px 6px;
        border: 0;
        background: var(--prs);
        border-radius: 9px;
        width: auto;
        margin-right: 6px;
        -webkit-appearance: none;
        appearance: none;
        text-align: center;
      }
      .ex {
        display: grid;
        grid-template-columns: 1fr 1.4fr;
        gap: 10px;
        margin-top: 10px;
      }
      .ex input {
        padding: 8px 10px;
        font-size: 14px;
      }
      .mt {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--mu);
        align-items: center;
      }
      .b {
        padding: 2px 9px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 650;
        background: var(--prs);
        color: var(--pr);
      }
      .b.w {
        background: var(--was);
        color: var(--wa);
      }
      .b.d {
        background: var(--rds);
        color: var(--rd);
      }
      .b.g {
        background: var(--oks);
        color: var(--ok);
      }
      .ch {
        margin: 18px 4px 8px;
        font-size: 12px;
        font-weight: 700;
        color: var(--mu);
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--card);
        border-top: 1px solid var(--br);
        display: flex;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
        z-index: 10;
      }
      nav button {
        flex: 1;
        padding: 6px 0;
        font-size: 11px;
        font-weight: 600;
        color: var(--mu);
        border-radius: 12px;
      }
      nav button span {
        display: block;
        font-size: 21px;
      }
      nav .on {
        color: var(--pr);
        background: var(--prs);
      }
      .pn {
        background: var(--card);
        border-radius: 16px;
        padding: 14px;
        margin-bottom: 10px;
        box-shadow: var(--sh);
      }
      .pn h3 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      .g3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 10px;
      }
      .kp {
        background: var(--card);
        border-radius: 16px;
        padding: 12px;
        text-align: center;
        box-shadow: var(--sh);
      }
      .kp b {
        font-size: 24px;
        display: block;
      }
      .kp small {
        color: var(--mu);
      }
      .lg {
        padding: 10px 0;
        border-bottom: 1px solid var(--br);
        font-size: 14px;
      }
      .lg:last-child {
        border: 0;
      }
      .bar {
        height: 8px;
        border-radius: 6px;
        background: var(--br);
        overflow: hidden;
        margin-top: 4px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--ok);
      }
      .pb {
        width: 100%;
        padding: 13px;
        border-radius: 14px;
        background: var(--pr);
        color: #fff;
        font-weight: 700;
        margin-top: 8px;
      }
      .pb.s {
        background: var(--prs);
        color: var(--pr);
      }
      .ov {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, var(--hd1), var(--hd2));
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .lc {
        background: var(--card);
        border-radius: 24px;
        padding: 26px;
        width: 100%;
        max-width: 360px;
      }
      .lc h2 {
        margin: 0 0 4px;
      }
      .lc p {
        color: var(--mu);
        margin: 0 0 16px;
        font-size: 14px;
      }
      .lc input {
        margin-bottom: 10px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(92px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: #101828;
        color: #fff;
        padding: 10px 16px;
        border-radius: 14px;
        z-index: 60;
        font-size: 14px;
        animation: t 2.2s forwards;
      }
      @keyframes t {
        0%,
        85% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      .pop {
        position: fixed;
        left: 50%;
        top: 42%;
        font-size: 64px;
        pointer-events: none;
        animation: up 1.2s forwards;
        z-index: 70;
        transform: translate(-50%, -50%);
      }
      @keyframes up {
        to {
          opacity: 0;
          transform: translate(-50%, -150%) scale(1.5);
        }
      }
      .em {
        text-align: center;
        color: var(--mu);
        padding: 30px;
      }
      .fab {
        position: fixed;
        left: 14px;
        right: 14px;
        max-width: 692px;
        margin: 0 auto;
        bottom: calc(82px + env(safe-area-inset-bottom, 0px));
        z-index: 9;
        padding: 14px;
        border-radius: 16px;
        background: var(--pr);
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        box-shadow: 0 6px 20px #3366ff55;
      }
      .fab.ok {
        background: var(--card);
        color: var(--ok);
        border: 1.5px solid var(--ok);
        box-shadow: var(--sh);
      }
      .card.dirty {
        background: var(--prs);
        border-color: #3366ff33;
      }
      .sb {
        flex: none;
        padding: 8px 14px;
        border-radius: 20px;
        background: var(--card);
        color: var(--pr);
        border: 1.5px solid var(--pr);
        font-weight: 600;
        font-size: 13px;
      }
      .card.flash {
        animation: fl 0.9s;
      }
      @keyframes fl {
        0% {
          background: var(--oks);
        }
      }
      :root {
        --bg: #f6f1e7;
        --card: #fffdf9;
        --tx: #13262f;
        --mu: #6b7a80;
        --br: #e6dcc8;
        --pr: #0f5c70;
        --prs: #e2f0f2;
        --ok: #168a5b;
        --oks: #e2f4ea;
        --wa: #d9532b;
        --was: #fdeadf;
        --rd: #c2303f;
        --rds: #fde8ea;
        --hd1: #0a2a3b;
        --hd2: #14566b;
        --gold: #c9a24d;
        --gs: #fbf3dc;
        --sh: 0 2px 12px #0a2a3b14;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b1a22;
          --card: #13262f;
          --tx: #eef2ef;
          --mu: #93a5ab;
          --br: #25404c;
          --pr: #4fb3c8;
          --prs: #173742;
          --ok: #3ecf95;
          --oks: #13322a;
          --wa: #ff8a5c;
          --was: #3a2318;
          --rd: #ff6b7a;
          --rds: #3b1c22;
          --hd1: #071a25;
          --hd2: #0f4152;
          --gold: #d9b36a;
          --gs: #33291a;
          --sh: none;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b1a22;
        --card: #13262f;
        --tx: #eef2ef;
        --mu: #93a5ab;
        --br: #25404c;
        --pr: #4fb3c8;
        --prs: #173742;
        --ok: #3ecf95;
        --oks: #13322a;
        --wa: #ff8a5c;
        --was: #3a2318;
        --rd: #ff6b7a;
        --rds: #3b1c22;
        --hd1: #071a25;
        --hd2: #0f4152;
        --gold: #d9b36a;
        --gs: #33291a;
        --sh: none;
      }
      .big {
        font-family: Georgia, "Times New Roman", serif;
      }
      .brand {
        font-family: Georgia, "Times New Roman", serif;
        letter-spacing: 0.22em;
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 14px;
        color: #f3dfae;
      }
      .brand small {
        display: block;
        letter-spacing: 0.08em;
        font-size: 11px;
        font-weight: 400;
        color: #ffffffb8;
        font-family: system-ui, sans-serif;
        margin-top: 2px;
      }
      .fab {
        box-shadow: 0 6px 20px #0a2a3b55;
      }
      .card.dirty {
        background: var(--gs);
        border-color: var(--gold);
        box-shadow: 0 0 0 3px #c9a24d30;
      }
      .sb {
        display: block;
        width: 100%;
        margin-bottom: 10px;
        padding: 10px;
        border-radius: 12px;
        background: var(--oks);
        color: var(--ok);
        border: 1.5px solid var(--ok);
        font-weight: 700;
        font-size: 14px;
      }
      .ubar {
        position: sticky;
        top: 8px;
        z-index: 8;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--gs);
        border: 1.5px solid var(--gold);
        border-radius: 16px;
        padding: 10px 12px;
        margin-bottom: 10px;
        box-shadow: 0 6px 18px #0003;
        font-weight: 600;
      }
      .ubar button {
        margin-left: auto;
        background: var(--ok);
        color: #fff;
        border-radius: 20px;
        padding: 10px 18px;
        font-weight: 700;
      }
      .sva {
        position: relative;
      }
      .sva i {
        position: absolute;
        top: -5px;
        right: -5px;
        background: #ffd43b;
        color: #222;
        border-radius: 10px;
        font-size: 11px;
        font-style: normal;
        font-weight: 700;
        min-width: 18px;
        padding: 0 5px;
        line-height: 18px;
      }
      .roster {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        max-height: 52vh;
        overflow-y: auto;
        margin-top: 6px;
      }
      .pp {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 14px 8px;
        border-radius: 16px;
        background: var(--bg);
        border: 1.5px solid var(--br);
      }
      .pp:active {
        border-color: var(--pr);
        background: var(--prs);
      }
      .pp b {
        font-size: 15px;
      }
      .av2 {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--pr);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 20px;
        font-family: Georgia, serif;
      }
      .who {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        margin: 6px 0 14px;
      }
      .dots {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .dots i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--pr);
      }
      .dots i.f {
        background: var(--pr);
      }
      .pad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 6px;
      }
      .pad button {
        height: 56px;
        border-radius: 16px;
        background: var(--bg);
        border: 1.5px solid var(--br);
        font-size: 22px;
        font-weight: 600;
      }
      .pad button:active {
        background: var(--prs);
      }
      .bk {
        color: var(--pr);
        font-weight: 600;
        padding: 4px 0;
      }
      .card.dirty {
        border-color: var(--gold);
        background: color-mix(in srgb, var(--gs) 45%, var(--card));
        box-shadow: 0 0 0 4px #c9a24d1f;
      }
      .card.dirty .tick {
        background: var(--card);
        border-color: var(--ok);
        color: var(--ok);
        animation: rdy 1.6s ease-in-out infinite;
      }
      @keyframes rdy {
        50% {
          box-shadow: 0 0 0 6px #16a87026;
        }
      }
      .mt {
        min-height: 26px;
      }
      .st .qv {
        width: auto;
        flex: 1;
        min-width: 0;
        height: 46px;
        font-size: 20px;
        font-weight: 700;
        color: var(--tx);
      }
      .st .qv.e {
        color: var(--mu);
        font-weight: 500;
        font-size: 16px;
      }
      .wq {
        grid-column: 1/3;
        width: 100%;
        height: 44px;
        border-radius: 13px;
        border: 1.5px solid var(--br);
        background: var(--bg);
        color: var(--mu);
        font-size: 14px;
      }
      .ubar {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 8px);
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        z-index: 12;
        padding: 8px 8px 8px 16px;
        white-space: nowrap;
        max-width: calc(100% - 20px);
      }
      .sh-bg {
        position: fixed;
        inset: 0;
        background: #0009;
        z-index: 40;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        background: var(--card);
        width: 100%;
        max-width: 520px;
        border-radius: 24px 24px 0 0;
        padding: 16px 18px calc(16px + env(safe-area-inset-bottom, 0px));
        animation: su 0.2s;
      }
      @keyframes su {
        from {
          transform: translateY(40px);
          opacity: 0;
        }
      }
      .sh-t {
        text-align: center;
        color: var(--mu);
        font-size: 13px;
        font-weight: 600;
      }
      .sh-v {
        text-align: center;
        font-size: 34px;
        font-weight: 800;
        font-family: Georgia, serif;
        margin: 2px 0 4px;
      }
      .wh {
        position: relative;
        display: flex;
        justify-content: center;
        gap: 6px;
        height: 220px;
        margin-bottom: 10px;
        isolation: isolate;
      }
      .wc {
        position: relative;
        z-index: 1;
        width: 120px;
        height: 220px;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
        padding: 88px 0;
        overscroll-behavior: contain;
      }

    <script>
      /* ===== THE SHELL – Kitchen Stock · Supabase version ===== */
      const { SUPABASE_URL, SUPABASE_KEY } = window.APP_CONFIG || {
        SUPABASE_URL: "https://ukzhutdvnfjkxbthsxag.supabase.co",
        SUPABASE_KEY:
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVremh1dGR2bmZqa3hidGhzeGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwMTk3MjUsImV4cCI6MjEwNzU5NTcyNX0.dKK1iacGwQRmAmnuOLbQYm3pWXmnOlNZPe3N84Cd0vA",
      };
      const $ = (s) => document.querySelector(s);
      if (SUPABASE_URL.includes("YOUR-PROJECT")) {
        document.body.innerHTML =
          '<div style="padding:30px;font:16px system-ui"><h2>Setup needed</h2><p>Open <b>config.js</b> and paste your Supabase URL and anon key (see README.md).</p></div>';
        throw new Error("Supabase not configured");
      }
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      const E = {
        Seafood: "🦞",
        Meat: "🥩",
        "Veg & Sides": "🥦",
        "Dessert & Other": "🍰",
      };
      const IC = {
        Lobster: "🦞",
        Crab: "🦀",
        Mussels: "🐚",
        Oyster: "🦪",
        Whelks: "🐌",
        Squid: "🦑",
        Langoustine: "🍤",
        "Snow crab": "❄️",
        Seabass: "🐟",
        Salmon: "🍣",
        "Fish & chips": "🐠",
        Octopus: "🐙",
        Calamari: "⭕",
        Scallops: "🍽️",
        Prawns: "🦐",
        "Arctic shrimp": "🧊",
        "Crab meat": "🥫",
        "Shell-off prawns": "🥢",
        "Sirloin steak": "🥩",
        "Ribeye steak": "🍖",
        "Fillet steak": "🔪",

        "Chicken fillet": "🍗",
        "Minced beef": "🐄",
        Salad: "🥗",
        Broccoli: "🥦",
        Lemon: "🍋",

        "Sweet potato": "🍠",
        Tiramisu: "🍰",
        "Vanilla ice cream": "🍦",
        "Crème brûlée": "🍮",
        "Flora butter": "🧈",
        "Bins cleaning": "🗑️",
      };
      const UNITS = [
        "pcs",
        "portion",
        "cut",
        "kg",
        "box",
        "bag",
        "pack",
        "tub",
        "tray",
        "leg",
        "item",
      ];
      const ROLE = { owner: "Boss", manager: "Manager", staff: "Employee" };
      const NAV = {
        staff: [
          ["check", "📋", "Check"],
          ["sum", "🍳", "To prep"],
        ],
        manager: [
          ["check", "📋", "Check"],
          ["sum", "📊", "Summary"],
          ["par", "🎯", "Targets"],
          ["log", "🕵️", "Activity"],
          ["hist", "📅", "History"],
        ],
      };
      NAV.owner = [...NAV.manager, ["team", "👥", "Team"]];
      const LBL = {
        cooked: "Cooked/Defrosted",
        raw: "Live/Raw/Frozen",
        use: "Use-by date",
        note: "Note",
        waste: "Dead/waste",
        pu: "Cooked unit",
        ru: "Raw unit",
      };
      let ITEMS = [],
        CATS = ["All"],
        PAR = {},
        EMAIL = "";
      const today = () =>
        new Date().toLocaleDateString("en-CA", { timeZone: "Europe/London" });
      let S = {
        user: null,
        date: today(),
        day: { items: {}, log: [], pushes: [] },
        tab: "check",
        cat: "All",
        prev: {},
      };
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const tm = (t) =>
        new Date(t).toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
      const dtm = (t) =>
        new Date(t).toLocaleString([], {
          day: "numeric",
          month: "short",
          hour: "2-digit",
          minute: "2-digit",
        });
      const has = (v) => v !== undefined && v !== null && v !== "";
      const num = (v) =>
        has(v) && !isNaN(parseFloat(v)) ? parseFloat(v) : null;
      const q = async (p) => (await p).data || [];
      const ico = (i) => IC[i.name] || E[i.cat];
      const R = (id) => S.day.items[id] || {};
      const U = (i, k) => R(i.id)[k] || i[k];
      const nameOf = (id) => (ITEMS.find((i) => i.id === id) || {}).name || id;
      const isMgr = () => S.user && S.user.role !== "staff";
      const touched = (r) => has(r.cooked) || has(r.raw);
      const isDirty = (id) => !!R(id).dirty;
      const pending = () => ITEMS.filter((i) => isDirty(i.id)).length;
      function toast(m) {
        const t = document.createElement("div");
        t.className = "toast";
        t.textContent = m;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2400);
      }
      function pop(e) {
        const p = document.createElement("div");
        p.className = "pop";
        p.textContent = e;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1300);
      }

      /* ---------- database <-> screen ---------- */
      const fromRow = (r) => ({
        cooked: r.cooked ?? "",
        raw: r.raw ?? "",
        use: r.use_by || "",
        note: r.note || "",
        waste: r.waste ?? "",
        done: !!r.done,
        pu: r.pu || "",
        ru: r.ru || "",
        by: r.updated_by_name,
        num: r.staff_num,
        at: +new Date(r.updated_at),
      });
      const toRow = (id, r) => ({
        day: S.date,
        item_id: id,
        cooked: num(r.cooked),
        raw: num(r.raw),
        use_by: r.use || null,
        note: r.note || null,
        waste: num(r.waste),
        done: !!r.done,
        pu: r.pu || null,
        ru: r.ru || null,
      });
      const fetchLog = async (d) =>
        isMgr()
          ? (
              await q(
                sb
                  .from("change_log")
                  .select("*")
                  .eq("day", d)
                  .order("at", { ascending: false }),
              )
            ).map((l) => ({
              t: +new Date(l.at),
              who: l.who,
              num: l.staff_num,
              id: l.item_id,
              f: l.field === "use_by" ? "use" : l.field,
              old: l.old_value,
              val: l.field === "done" ? l.new_value === "true" : l.new_value,
            }))
          : [];
      const fetchReports = async (d) =>
        isMgr()
          ? (
              await q(
                sb
                  .from("reports")
                  .select("*")
                  .eq("day", d)
                  .order("sent_at", { ascending: false }),
              )
            ).map((p) => ({
              t: +new Date(p.sent_at),
              who: p.sent_by_name,
              to: p.sent_to,
              checked: p.checked,
            }))
          : [];
      async function loadDay(d) {
        const [rows, log, pushes] = await Promise.all([
          q(sb.from("stock_entries").select("*").eq("day", d)),
          fetchLog(d),
          fetchReports(d),
        ]);
        const items = {};
        rows.forEach((r) => (items[r.item_id] = fromRow(r)));
        return { items, log, pushes };
      }
      async function loadPrev(d) {
        const p = await q(
          sb
            .from("day_summary")
            .select("day")
            .lt("day", d)
            .order("day", { ascending: false })
            .limit(1),
        );
        if (!p[0]) return {};
        const o = {};
        (
          await q(
            sb
              .from("stock_entries")
              .select("item_id,cooked,raw,waste")
              .eq("day", p[0].day),
          )
        ).forEach(
          (r) =>
            (o[r.item_id] = { cooked: r.cooked, raw: r.raw, waste: r.waste }),
        );
        return o;
      }
      async function openDay(d) {
        S.date = d;
        $("#date").value = d;
        $("#list").innerHTML = '<div class="em">Loading…</div>';
        [S.day, S.prev] = await Promise.all([loadDay(d), loadPrev(d)]);
        renderAll();
      }
      function change(id, f, val) {
        const r = (S.day.items[id] = S.day.items[id] || {});
        if (String(r[f] ?? "") === String(val ?? "")) return;
        r[f] = val;
        r.dirty = true;
        r.by = S.user.name;
        r.num = S.user.num;
        r.at = Date.now();
      }
      async function saveIds(ids, quiet) {
        ids = ids.filter((id) => S.day.items[id]);
        if (!ids.length) return true;
        const { data, error } = await sb
          .from("stock_entries")
          .upsert(
            ids.map((id) => toRow(id, S.day.items[id])),
            { onConflict: "day,item_id" },
          )
          .select();
        if (error) {
          toast("Save failed: " + error.message);
          return false;
        }
        data.forEach((r) => (S.day.items[r.item_id] = fromRow(r)));
        ids.forEach((id) => {
          rep(id);
          document
            .querySelector(`.card[data-id="${id}"]`)
            ?.classList.add("flash");
        });
        if (!quiet) toast(ids.length > 1 ? "All saved ✓" : "Saved ✓");
        fetchLog(S.date).then((l) => (S.day.log = l));
        return true;
      }
      const saveAll = (quiet) => {
        const ids = ITEMS.filter((i) => isDirty(i.id)).map((i) => i.id);
        ids.forEach((id) => change(id, "done", true));
        return saveIds(ids, quiet);
      };
      async function sendFinal() {
        if (
          !confirm(
            "Send the FINAL report by email now? Do this once, at the end of the day.",
          )
        )
          return;
        if (!EMAIL) {
          toast("Save the report email in the Summary tab first");
          return;
        }
        if (!(await saveAll(true))) return;
        const b = $("#push");
        b.disabled = true;
        const { data, error } = await sb.functions.invoke("send-report", {
          body: { day: S.date },
        });
        b.disabled = false;
        if (error || !data || data.error) {
          toast(
            "Sending failed: " +
              ((data && data.error) || (error && error.message) || "unknown"),
          );
          return;
        }
        S.day.log = await fetchLog(S.date);
        S.day.pushes = await fetchReports(S.date);
        pushBar();
        pop("🚀");
        toast("Final report sent 📧 to " + data.to);
      }

      /* ---------- cards ---------- */
      const need = (i) => {
        const p = PAR[i.id] || {},
          r = R(i.id),
          o = {};
        if (p.c > 0) {
          if (has(r.cooked)) {
            const d = p.c - (+r.cooked || 0);
            if (d > 0) o.c = d;
          } else o.nc = 1;
        }
        if (p.r > 0 && has(r.raw)) {
          const d = p.r - (+r.raw || 0);
          if (d > 0) o.r = d;
        }
        return o;
      };
      function needB(i) {
        const p = PAR[i.id] || {},
          n = need(i),
          w = +R(i.id).waste;
        return (
          (p.c > 0
            ? `<span class="b ${n.c ? "d" : "g"}">Target ${p.c}${n.c ? " · cook +" + n.c : " ✓"}</span>`
            : "") +
          (n.r ? `<span class="b w">Raw low +${n.r}</span>` : "") +
          (w ? `<span class="b d">☠ ${w} dead/waste</span>` : "")
        );
      }
      function badges(i) {
        const r = R(i.id);
        let m = "";
        if (r.use) {
          const d = Math.round((new Date(r.use) - new Date(S.date)) / 864e5);
          m +=
            d < 0
              ? `<span class="b d">⚠ Expired ${-d}d ago</span>`
              : d == 0
                ? '<span class="b d">⚠ Use today</span>'
                : d <= 2
                  ? `<span class="b w">⏳ ${d}d left</span>`
                  : `<span class="b g">Use by ${String(r.use).slice(5)}</span>`;
        }
        if (touched(r) && !+r.cooked && !+r.raw)
          m += '<span class="b d">Out of stock</span>';
        m += needB(i);
        m += !r.dirty && r.by ? '<span class="b g">☁ Saved</span>' : "";
        return (
          m +
          (r.by
            ? `<span>✏️ ${esc(r.by)} (#${esc(r.num)}) · ${tm(r.at)}</span>`
            : "<span>Not touched yet</span>")
        );
      }
      const isAlert = (i) => {
        const r = R(i.id);
        return (
          (r.use && r.use <= S.date) ||
          (touched(r) && !+r.cooked && !+r.raw) ||
          need(i).c ||
          need(i).r
        );
      };
      const SAVEBTN =
        '<button class="sb" data-a="save">✓ Save changes</button>';
      const showSave = (c) => {
        if (!c.querySelector(".sb"))
          c.insertAdjacentHTML("afterbegin", SAVEBTN);
      };
      const unitSel = (i, k) => {
        const v = U(i, k),
          o = UNITS.includes(v) ? UNITS : [...UNITS, v];
        return `<select class="un" data-u="${k}">${o.map((u) => `<option${u === v ? " selected" : ""}>${u}</option>`).join("")}</select>`;
      };
      const qty = (i, f, lab, k) => {
        const v = R(i.id)[f],
          e = !has(v);
        return `<div><div class="lb">${lab}</div><div class="st"><button class="qv${e ? " e" : ""}" data-a="pick" data-f="${f}">${e ? "Tap" : esc(v)}</button>${unitSel(i, k)}</div></div>`;
      };
      function card(i) {
        const r = R(i.id),
          d = isDirty(i.id),
          w = r.waste,
          pv = (S.prev[i.id] || {}).cooked;
        return `<div class="card ${r.done ? "done" : ""} ${d ? "dirty" : ""}" data-id="${i.id}">
 <div class="r"><div class="ic">${ico(i)}</div><div class="sp"><div class="nm">${esc(i.name)}</div><div class="sub">${i.cat}${has(pv) ? " · yesterday " + pv : ""}</div></div><button class="tick" data-a="save" aria-label="Save">✓</button></div>
 <div class="q2">${qty(i, "cooked", "Cooked / Defrosted", "pu")}${qty(i, "raw", "Live / Raw / Frozen", "ru")}</div>
 <div class="ex"><input data-f="use" type="date" value="${esc(r.use)}" title="Use-by / Prep date"><input data-f="note" placeholder="📝 Note (optional)" value="${esc(r.note)}"><button class="wq" data-a="pick" data-f="waste">${has(w) ? "☠ Dead / waste: " + esc(w) : "☠ Dead / waste qty"}</button></div>
 <div class="mt">${badges(i)}</div></div>`;
      }
      const rep = (id) => {
        const c = document.querySelector(`.card[data-id="${id}"]`);
        if (c) c.outerHTML = card(ITEMS.find((i) => i.id === id));
        stats();
      };
      function soft(c, id) {
        c.classList.add("dirty");
        c.classList.toggle("done", !!R(id).done);
        c.querySelector(".mt").innerHTML = badges(
          ITEMS.find((i) => i.id === id),
        );
        stats();
      }
      const autoTick = (id, f) => {
        if ((f === "cooked" || f === "raw") && !R(id).done) {
          change(id, "done", true);
          pop("✓");
        }
      };
      function renderList() {
        const qv = $("#q").value.toLowerCase(),
          sf = $("#sf").value;
        let h = "",
          last = "";
        ITEMS.filter(
          (i) =>
            (S.cat === "All" || i.cat === S.cat) &&
            i.name.toLowerCase().includes(qv) &&
            (sf === "all" ||
              (sf === "done"
                ? R(i.id).done
                : sf === "todo"
                  ? !R(i.id).done
                  : isAlert(i))),
        ).forEach((i) => {
          if (S.cat === "All" && i.cat !== last) {
            h += `<div class="ch">${E[i.cat]} ${i.cat}</div>`;
            last = i.cat;
          }
          h += card(i);
        });
        $("#list").innerHTML = h || '<div class="em">Nothing here 🎉</div>';
        $("#chips").innerHTML = CATS.map(
          (c) =>
            `<button class="chip ${c === S.cat ? "on" : ""}" data-c="${c}">${c === "All" ? "All" : E[c] + " " + c}</button>`,
        ).join("");
      }
      function stats() {
        const n = ITEMS.filter((i) => R(i.id).done).length,
          t = ITEMS.length,
          p = t ? Math.round((n / t) * 100) : 0,
          xp = n * 10;
        $("#ring").style.setProperty("--p", p);
        $("#pc").textContent = p + "%";
        $("#cnt").textContent = `${n} / ${t} checked`;
        $("#lv").textContent =
          `⭐ Level ${Math.floor(xp / 100) + 1} · ${xp} XP` +
          (t && n == t ? " 🏆" : "");
        pushBar();
      }
      function pushBar() {
        const b = $("#push"),
          n = pending(),
          p = S.day.pushes[0];
        b.hidden = S.tab !== "check" || !S.user || !isMgr();
        const ok = p && !n && !(S.day.log[0] && S.day.log[0].t > p.t);
        b.className = "fab" + (ok ? " ok" : "");
        b.textContent = ok
          ? "✓ Final report sent · " + tm(p.t) + " (tap to resend)"
          : "📧 Send final report" + (n ? ` (${n} unsaved)` : "");
        $("#ubar").hidden = !n || S.tab !== "check";
        $("#svn").textContent = n;
      }
      const renderAll = () => {
        stats();
        renderList();
      };

      /* ---------- other tabs ---------- */
      function prepPanel() {

      /* ---------- number picker (scroll wheel) ---------- */
      let PK = null;
      const WH = Array.from({ length: 301 }, (_, k) => String(k)),

      function wheel(el, vals, idx, onch) {
        el.innerHTML = vals
          .map((v, i) => `<div data-i="${i}">${v}</div>`)
          .join("");
        el.scrollTop = idx * 44;
        let t;
        const mark = () => {
          const i = Math.max(
            0,
            Math.min(vals.length - 1, Math.round(el.scrollTop / 44)),
          );
          [...el.children].forEach((c, j) => c.classList.toggle("on", j === i));
        };
        mark();
        el.onscroll = () => {
          mark();
          clearTimeout(t);
          t = setTimeout(onch, 100);
        };
        el.onclick = (e) => {
          const d = e.target.closest("div[data-i]");
          if (d) el.scrollTo({ top: d.dataset.i * 44, behavior: "smooth" });
        };
      }
      function fromWheels() {
        if (!PK || PK.lock) return;
        const w = Math.min(300, Math.round($("#w1").scrollTop / 44)),
          f = Math.round($("#w2").scrollTop / 44),
          v = w + (f ? 0.5 : 0);
        $("#shi").value = String(v);
        $("#shv").textContent = v;

      function openPicker(id, f) {
        const i = ITEMS.find((x) => x.id === id),
          pv = (S.prev[id] || {})[f];
        let v = parseFloat(R(id)[f]);
        if (isNaN(v)) v = parseFloat(pv);
        if (isNaN(v)) v = 0;
        PK = { id, f, lock: true };
        $("#sht").textContent =
          i.name +
          " · " +
          {
            cooked: "Cooked / Defrosted",
            raw: "Live / Raw / Frozen",
            waste: "Dead / waste",
          }[f] +
          " (" +
          (f === "raw" ? U(i, "ru") : U(i, "pu")) +
          ")" +
          (has(pv) ? " · yesterday " + pv : "");
        $("#shb").hidden = false;
        $("#shi").value = String(v);
        $("#shv").textContent = v;
        wheel($("#w1"), WH, Math.min(300, Math.floor(v)), fromWheels);
        wheel(
          $("#w2"),
          FR,
          Math.abs(v - Math.floor(v) - 0.5) < 1e-9 ? 1 : 0,
          fromWheels,
        );
        setTimeout(() => {
          PK.lock = false;
        }, 250);
      }

        $("#w2").scrollTop =

        await afterAuth(data.session);
      }
      $("#lgo").onclick = doLogin;
      function head() {
        const h = new Date().getHours();
        $("#hi").textContent =
          (h < 12
            ? "Good morning"
            : h < 18
              ? "Good afternoon"
              : "Good evening") + " 👋";
        $("#gr").textContent = S.user.name + " · " + ROLE[S.user.role];
        $("#av").textContent = S.user.name[0].toUpperCase();
      }
      async function afterAuth(session) {
        const { data: p, error } = await sb
          .from("profiles")
          .select("*")
          .eq("id", session.user.id)
          .single();
        if (error || !p || !p.active) {
          await sb.auth.signOut();
          showLogin();
          toast("This account is not active. Ask the boss.");
          return;
        }
        S.user = {
          id: p.id,
          num: p.staff_num,
          name: p.full_name,
          role: p.role,
        };
        const [items, par, set] = await Promise.all([
          q(sb.from("items").select("*").order("sort")),
          q(sb.from("par_levels").select("*")),
          isMgr()
            ? q(sb.from("settings").select("*").eq("key", "report_email"))
            : [],
        ]);
        ITEMS = items.map((r) => ({
          id: r.id,
          cat: r.cat,
          name: r.name,
          pu: r.pu,
          ru: r.ru,
        }));
        CATS = ["All", ...new Set(ITEMS.map((i) => i.cat))];
        par.forEach((r) => (PAR[r.item_id] = { c: r.cooked, r: r.raw }));
        EMAIL = set[0] ? set[0].value : "";
        S.date = today();
        $("#login").hidden = true;
        head();
        applyRole();
        await openDay(S.date);
        sb.from("login_log")
          .insert({
            user_id: p.id,
            who: p.full_name,
            staff_num: p.staff_num,
            role: p.role,
          })
          .then(() => {});
        sb.channel("stock")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "stock_entries" },
            (pl) => {
              const r = pl.new;
              if (
                !r ||
                !r.item_id ||
                r.day !== S.date ||
                isDirty(r.item_id) ||
                document.activeElement?.closest(".card")?.dataset.id ===
                  r.item_id
              )
                return;
              S.day.items[r.item_id] = fromRow(r);
              S.tab === "check" ? rep(r.item_id) : stats();
            },
          )
          .subscribe();
      }
      $("#out").onclick = async () => {
        if (pending() && !confirm("You have unsaved changes. Sign out anyway?"))
          return;
        await sb.auth.signOut();
        location.reload();
      };
      $("#th").onclick = () => {
        const d = document.documentElement,
          dark =
            d.dataset.theme === "dark" ||
            (!d.dataset.theme &&
              matchMedia("(prefers-color-scheme:dark)").matches);
        d.dataset.theme = dark ? "light" : "dark";
        try {
          localStorage.setItem("sq:theme", d.dataset.theme);
        } catch (e) {}
      };
      try {
        const t = localStorage.getItem("sq:theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
      $("#date").value = S.date;
      sb.auth
        .getSession()
        .then(({ data }) =>
          data.session ? afterAuth(data.session) : showLogin(),
        );
    </script>
  </body>
</html>
