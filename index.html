<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a2a3b" />
    <title>The Shell – Kitchen Stock</title>
    <style>
      :root {
        --bg: #f2f5fb;
        --card: #fff;
        --tx: #141b2b;
        --mu: #6c7589;
        --br: #e3e8f1;
        --pr: #3366ff;
        --prs: #e8eeff;
        --ok: #16a870;
        --oks: #e3f7ee;
        --wa: #e8590c;
        --was: #fff0e6;
        --rd: #d6334a;
        --rds: #ffe8ec;
        --hd1: #1f3864;
        --hd2: #3a5bc7;
        --sh: 0 2px 10px #1b2a5014;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e1320;
          --card: #182033;
          --tx: #e9eef8;
          --mu: #94a0b8;
          --br: #273049;
          --pr: #6c92ff;
          --prs: #202c52;
          --ok: #3ecf95;
          --oks: #143327;
          --wa: #ff8a4c;
          --was: #3a2416;
          --rd: #ff6b82;
          --rds: #3b1b24;
          --hd1: #13203d;
          --hd2: #25408f;
          --sh: none;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e1320;
        --card: #182033;
        --tx: #e9eef8;
        --mu: #94a0b8;
        --br: #273049;
        --pr: #6c92ff;
        --prs: #202c52;
        --ok: #3ecf95;
        --oks: #143327;
        --wa: #ff8a4c;
        --was: #3a2416;
        --rd: #ff6b82;
        --rds: #3b1b24;
        --hd1: #13203d;
        --hd2: #25408f;
        --sh: none;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      [hidden] {
        display: none !important;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          15px/1.4 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: var(--tx);
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
      }
      input,
      select,
      textarea {
        background: var(--bg);
        border: 1.5px solid var(--br);
        border-radius: 12px;
        padding: 10px 12px;
        width: 100%;
        outline: none;
      }
      input:focus,
      textarea:focus,
      select:focus {
        border-color: var(--pr);
      }
      .hero {
        background: linear-gradient(135deg, var(--hd1), var(--hd2));
        color: #fff;
        padding: 16px 16px 22px;
        border-radius: 0 0 26px 26px;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
      }
      .r {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sp {
        flex: 1;
      }
      .av {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #ffffff2e;
        display: grid;
        place-items: center;
        font-weight: 700;
      }
      .hi {
        font-size: 13px;
        opacity: 0.85;
      }
      .big {
        font-size: 20px;
        font-weight: 750;
      }
      .ib {
        background: #ffffff26;
        color: #fff;
        border-radius: 12px;
        width: 40px;
        height: 40px;
        font-size: 18px;
      }
      .prog {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 16px;
      }
      .ring {
        --p: 0;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        background: conic-gradient(#ffd43b calc(var(--p) * 1%), #ffffff30 0);
        display: grid;
        place-items: center;
        transition: 0.4s;
        flex: none;
      }
      .ring b {
        width: 66px;
        height: 66px;
        border-radius: 50%;
        background: var(--hd1);
        display: grid;
        place-items: center;
        font-size: 19px;
      }
      .pl {
        font-size: 13px;
        line-height: 1.6;
      }
      .pl strong {
        font-size: 16px;
      }
      .dt {
        background: #ffffff26;
        border: 0;
        color: #fff;
        border-radius: 12px;
        padding: 8px 10px;
        width: auto;
        color-scheme: dark;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 14px 14px 80px;
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 2px 0 10px;
        scrollbar-width: none;
      }
      .chip {
        flex: none;
        padding: 7px 14px;
        border-radius: 20px;
        background: var(--card);
        border: 1.5px solid var(--br);
        font-size: 14px;
        font-weight: 600;
        color: var(--mu);
      }
      .chip.on {
        background: var(--pr);
        border-color: var(--pr);
        color: #fff;
      }
      .tools {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .card {
        background: var(--card);
        border-radius: 18px;
        padding: 14px;
        margin-bottom: 10px;
        box-shadow: var(--sh);
        border: 2px solid transparent;
        transition: 0.2s;
      }
      .card.done {
        border-color: var(--ok);
        background: linear-gradient(var(--oks), var(--card) 70%);
      }
      .ic {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        background: var(--prs);
        display: grid;
        place-items: center;
        font-size: 22px;
        flex: none;
      }
      .nm {
        font-weight: 700;
        font-size: 16px;
      }
      .sub {
        font-size: 12px;
        color: var(--mu);
      }
      .tick {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 2.5px solid var(--br);
        font-size: 22px;
        color: transparent;
        flex: none;
        transition: 0.2s;
      }
      .done .tick {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
        transform: scale(1.06);
      }
      .q2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 12px;
      }
      .lb {
        font-size: 11px;
        font-weight: 600;
        color: var(--mu);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .st {
        display: flex;
        align-items: center;
        background: var(--bg);
        border-radius: 13px;
        border: 1.5px solid var(--br);
      }
      .st button {
        width: 40px;
        height: 44px;
        font-size: 22px;
        color: var(--pr);
        font-weight: 700;
      }
      .st input {
        border: 0;
        background: none;
        text-align: center;
        padding: 0;
        font-weight: 700;
        font-size: 18px;
        min-width: 0;
      }
      .un {
        flex: none;
        font-size: 12px;
        font-weight: 700;
        color: var(--pr);
        padding: 7px 6px;
        border: 0;
        background: var(--prs);
        border-radius: 9px;
        width: auto;
        margin-right: 6px;
        -webkit-appearance: none;
        appearance: none;
        text-align: center;
      }
      .ex {
        display: grid;
        grid-template-columns: 1fr 1.4fr;
        gap: 10px;
        margin-top: 10px;
      }
      .ex input {
        padding: 8px 10px;
        font-size: 14px;
      }
      .mt {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--mu);
        align-items: center;
      }
      .b {
        padding: 2px 9px;
        border-radius: 10px;
        font-size: 12px;
        font-weight: 650;
        background: var(--prs);
        color: var(--pr);
      }
      .b.w {
        background: var(--was);
        color: var(--wa);
      }
      .b.d {
        background: var(--rds);
        color: var(--rd);
      }
      .b.g {
        background: var(--oks);
        color: var(--ok);
      }
      .ch {
        margin: 18px 4px 8px;
        font-size: 12px;
        font-weight: 700;
        color: var(--mu);
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--card);
        border-top: 1px solid var(--br);
        display: flex;
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px));
        z-index: 10;
      }
      nav button {
        flex: 1;
        padding: 6px 0;
        font-size: 11px;
        font-weight: 600;
        color: var(--mu);
        border-radius: 12px;
      }
      nav button span {
        display: block;
        font-size: 21px;
      }
      nav .on {
        color: var(--pr);
        background: var(--prs);
      }
      .pn {
        background: var(--card);
        border-radius: 16px;
        padding: 14px;
        margin-bottom: 10px;
        box-shadow: var(--sh);
      }
      .pn h3 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      .g3 {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 10px;
      }
      .kp {
        background: var(--card);
        border-radius: 16px;
        padding: 12px;
        text-align: center;
        box-shadow: var(--sh);
      }
      .kp b {
        font-size: 24px;
        display: block;
      }
      .kp small {
        color: var(--mu);
      }
      .lg {
        padding: 10px 0;
        border-bottom: 1px solid var(--br);
        font-size: 14px;
      }
      .lg:last-child {
        border: 0;
      }
      .bar {
        height: 8px;
        border-radius: 6px;
        background: var(--br);
        overflow: hidden;
        margin-top: 4px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--ok);
      }
      .pb {
        width: 100%;
        padding: 13px;
        border-radius: 14px;
        background: var(--pr);
        color: #fff;
        font-weight: 700;
        margin-top: 8px;
      }
      .pb.s {
        background: var(--prs);
        color: var(--pr);
      }
      .ov {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, var(--hd1), var(--hd2));
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .lc {
        background: var(--card);
        border-radius: 24px;
        padding: 26px;
        width: 100%;
        max-width: 360px;
      }
      .lc h2 {
        margin: 0 0 4px;
      }
      .lc p {
        color: var(--mu);
        margin: 0 0 16px;
        font-size: 14px;
      }
      .lc input {
        margin-bottom: 10px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(92px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: #101828;
        color: #fff;
        padding: 10px 16px;
        border-radius: 14px;
        z-index: 60;
        font-size: 14px;
        animation: t 2.2s forwards;
      }
      @keyframes t {
        0%,
        85% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      .pop {
        position: fixed;
        left: 50%;
        top: 42%;
        font-size: 64px;
        pointer-events: none;
        animation: up 1.2s forwards;
        z-index: 70;
        transform: translate(-50%, -50%);
      }
      @keyframes up {
        to {
          opacity: 0;
          transform: translate(-50%, -150%) scale(1.5);
        }
      }
      .em {
        text-align: center;
        color: var(--mu);
        padding: 30px;
      }
      .fab {
        position: fixed;
        left: 14px;
        right: 14px;
        max-width: 692px;
        margin: 0 auto;
        bottom: calc(82px + env(safe-area-inset-bottom, 0px));
        z-index: 9;
        padding: 14px;
        border-radius: 16px;
        background: var(--pr);
        color: #fff;
        font-weight: 700;
        font-size: 16px;
        box-shadow: 0 6px 20px #3366ff55;
      }
      .fab.ok {
        background: var(--card);
        color: var(--ok);
        border: 1.5px solid var(--ok);
        box-shadow: var(--sh);
      }
      .card.dirty {
        background: var(--prs);
        border-color: #3366ff33;
      }
      .sb {
        flex: none;
        padding: 8px 14px;
        border-radius: 20px;
        background: var(--card);
        color: var(--pr);
        border: 1.5px solid var(--pr);
        font-weight: 600;
        font-size: 13px;
      }
      .card.flash {
        animation: fl 0.9s;
      }
      @keyframes fl {
        0% {
          background: var(--oks);
        }
      }
      :root {
        --bg: #f6f1e7;
        --card: #fffdf9;
        --tx: #13262f;
        --mu: #6b7a80;
        --br: #e6dcc8;
        --pr: #0f5c70;
        --prs: #e2f0f2;
        --ok: #168a5b;
        --oks: #e2f4ea;
        --wa: #d9532b;
        --was: #fdeadf;
        --rd: #c2303f;
        --rds: #fde8ea;
        --hd1: #0a2a3b;
        --hd2: #14566b;
        --gold: #c9a24d;
        --gs: #fbf3dc;
        --sh: 0 2px 12px #0a2a3b14;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0b1a22;
          --card: #13262f;
          --tx: #eef2ef;
          --mu: #93a5ab;
          --br: #25404c;
          --pr: #4fb3c8;
          --prs: #173742;
          --ok: #3ecf95;
          --oks: #13322a;
          --wa: #ff8a5c;
          --was: #3a2318;
          --rd: #ff6b7a;
          --rds: #3b1c22;
          --hd1: #071a25;
          --hd2: #0f4152;
          --gold: #d9b36a;
          --gs: #33291a;
          --sh: none;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b1a22;
        --card: #13262f;
        --tx: #eef2ef;
        --mu: #93a5ab;
        --br: #25404c;
        --pr: #4fb3c8;
        --prs: #173742;
        --ok: #3ecf95;
        --oks: #13322a;
        --wa: #ff8a5c;
        --was: #3a2318;
        --rd: #ff6b7a;
        --rds: #3b1c22;
        --hd1: #071a25;
        --hd2: #0f4152;
        --gold: #d9b36a;
        --gs: #33291a;
        --sh: none;
      }
      .big {
        font-family: Georgia, "Times New Roman", serif;
      }
      .brand {
        font-family: Georgia, "Times New Roman", serif;
        letter-spacing: 0.22em;
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 14px;
        color: #f3dfae;
      }
      .brand small {
        display: block;
        letter-spacing: 0.08em;
        font-size: 11px;
        font-weight: 400;
        color: #ffffffb8;
        font-family: system-ui, sans-serif;
        margin-top: 2px;
      }
      .fab {
        box-shadow: 0 6px 20px #0a2a3b55;
      }
      .card.dirty {
        background: var(--gs);
        border-color: var(--gold);
        box-shadow: 0 0 0 3px #c9a24d30;
      }
      .sb {
        display: block;
        width: 100%;
        margin-bottom: 10px;
        padding: 10px;
        border-radius: 12px;
        background: var(--oks);
        color: var(--ok);
        border: 1.5px solid var(--ok);
        font-weight: 700;
        font-size: 14px;
      }
      .ubar {
        position: sticky;
        top: 8px;
        z-index: 8;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--gs);
        border: 1.5px solid var(--gold);
        border-radius: 16px;
        padding: 10px 12px;
        margin-bottom: 10px;
        box-shadow: 0 6px 18px #0003;
        font-weight: 600;
      }
      .ubar button {
        margin-left: auto;
        background: var(--ok);
        color: #fff;
        border-radius: 20px;
        padding: 10px 18px;
        font-weight: 700;
      }
      .sva {
        position: relative;
      }
      .sva i {
        position: absolute;
        top: -5px;
        right: -5px;
        background: #ffd43b;
        color: #222;
        border-radius: 10px;
        font-size: 11px;
        font-style: normal;
        font-weight: 700;
        min-width: 18px;
        padding: 0 5px;
        line-height: 18px;
      }
      .roster {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        max-height: 52vh;
        overflow-y: auto;
        margin-top: 6px;
      }
      .pp {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 14px 8px;
        border-radius: 16px;
        background: var(--bg);
        border: 1.5px solid var(--br);
      }
      .pp:active {
        border-color: var(--pr);
        background: var(--prs);
      }
      .pp b {
        font-size: 15px;
      }
      .av2 {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--pr);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 20px;
        font-family: Georgia, serif;
      }
      .who {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        margin: 6px 0 14px;
      }
      .dots {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-bottom: 16px;
      }
      .dots i {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid var(--pr);
      }
      .dots i.f {
        background: var(--pr);
      }
      .pad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 6px;
      }
      .pad button {
        height: 56px;
        border-radius: 16px;
        background: var(--bg);
        border: 1.5px solid var(--br);
        font-size: 22px;
        font-weight: 600;
      }
      .pad button:active {
        background: var(--prs);
      }
      .bk {
        color: var(--pr);
        font-weight: 600;
        padding: 4px 0;
      }
      .card.dirty {
        border-color: var(--gold);
        background: color-mix(in srgb, var(--gs) 45%, var(--card));
        box-shadow: 0 0 0 4px #c9a24d1f;
      }
      .card.dirty .tick {
        background: var(--card);
        border-color: var(--ok);
        color: var(--ok);
        animation: rdy 1.6s ease-in-out infinite;
      }
      @keyframes rdy {
        50% {
          box-shadow: 0 0 0 6px #16a87026;
        }
      }
      .mt {
        min-height: 26px;
      }
      .st .qv {
        width: auto;
        flex: 1;
        min-width: 0;
        height: 46px;
        font-size: 20px;
        font-weight: 700;
        color: var(--tx);
      }
      .st .qv.e {
        color: var(--mu);
        font-weight: 500;
        font-size: 16px;
      }
      .wq {
        grid-column: 1/3;
        width: 100%;
        height: 44px;
        border-radius: 13px;
        border: 1.5px solid var(--br);
        background: var(--bg);
        color: var(--mu);
        font-size: 14px;
      }
      .ubar {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 8px);
        left: 50%;
        transform: translateX(-50%);
        margin: 0;
        z-index: 12;
        padding: 8px 8px 8px 16px;
        white-space: nowrap;
        max-width: calc(100% - 20px);
      }
      .sh-bg {
        position: fixed;
        inset: 0;
        background: #0009;
        z-index: 40;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        background: var(--card);
        width: 100%;
        max-width: 520px;
        border-radius: 24px 24px 0 0;
        padding: 16px 18px calc(16px + env(safe-area-inset-bottom, 0px));
        animation: su 0.2s;
      }
      @keyframes su {
        from {
          transform: translateY(40px);
          opacity: 0;
        }
      }
      .sh-t {
        text-align: center;
        color: var(--mu);
        font-size: 13px;
        font-weight: 600;
      }
      .sh-v {
        text-align: center;
        font-size: 34px;
        font-weight: 800;
        font-family: Georgia, serif;
        margin: 2px 0 4px;
      }
      .wh {
        position: relative;
        display: flex;
        justify-content: center;
        gap: 6px;
        height: 220px;
        margin-bottom: 10px;
        isolation: isolate;
      }
      .wc {
        position: relative;
        z-index: 1;
        width: 120px;
        height: 220px;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
        padding: 88px 0;
        overscroll-behavior: contain;

      async function toiletSummary() {
        const sl = await toiletToday(),
          H = hourOf(new Date()),
          past = sl.filter((s) => s.h <= H),
          issues = [];
        const ok = past.filter((s) => s.st === "ok").length,
          late = past.filter((s) => s.st === "late").length,
          skip = past.filter((s) => s.st === "skip").length,
          missed = sl.filter((s) => s.st === "missed"),
          cur = sl.find((s) => s.h === H);
        const two = sl.some(
            (s, i) => s.bz.length && sl[i + 1] && sl[i + 1].bz.length,
          ),
          probs = TOI.filter((x) => x.status === "problem" && !x.voided);
        if (missed.length)
          issues.push({
            sev: "r",
            text: `Missed toilet checks: ${missed.map((s) => hh(s.h)).join(", ")}`,
          });
        if (two)
          issues.push({
            sev: "a",
            text: "Toilets were busy two hours in a row",
          });
        if (toiletOpenNow() && cur && cur.st === "busy")
          issues.push({ sev: "a", text: `Check still owed (busy) — ${hh(H)}` });
        if (toiletOpenNow() && cur && cur.st === "due")
          issues.push({ sev: "a", text: `Check due now — ${hh(H)}` });
        probs.forEach((x) =>
          issues.push({
            sev: "a",
            text: `Problem at ${hh(x.slot_hour)}: ${esc(x.note)} (${esc(x.who)})`,
          }),
        );
        const cls = {
          ok: "g",
          late: "g",
          skip: "",
          busy: "a",
          due: "a",
          missed: "r",
          future: "",
        };
        return {
          st: issues.some((x) => x.sev === "r")
            ? "r"
            : issues.length
              ? "a"
              : "g",
          head:
            H < TO_OPEN
              ? "Opens at " + hh(TO_OPEN)
              : `${ok + late + skip} / ${past.length} hours done today`,
          issues,
          chips: [
            `✓ ${ok} on time`,
            `⏱ ${late} late`,
            `✕ ${missed.length} missed`,

          detail:
            `<div class="slots">${sl.map((s) => `<span class="slot ${cls[s.st]}">${hh(s.h)}</span>`).join("")}</div>` +

      const ORD = {
        items: "sort",
        par_levels: "item_id",
        stock_entries: "day",
        toilet_checks: "id",
        change_log: "id",
        audit_log: "id",
        reports: "id",
        settings: "key",
        profiles: "staff_num",
      };
      async function fetchAll(t) {
        let all = [],
          from = 0;
        for (;;) {
          let qy = sb.from(t).select("*").order(ORD[t]);
          if (t === "stock_entries") qy = qy.order("item_id");
          const { data, error } = await qy.range(from, from + 999);
          if (error) throw new Error(t + ": " + error.message);
          all = all.concat(data || []);
          if (!data || data.length < 1000) break;
          from += 1000;
        }
        return all;
      }
      async function backup() {
        const b = $("#bk");
        b.disabled = true;
        b.textContent = "Preparing…";
        try {
          const out = {
            exported_at: new Date().toISOString(),
            version: APP_VERSION,
            tables: {},
          };
          for (const t of Object.keys(ORD)) out.tables[t] = await fetchAll(t);
          const a = document.createElement("a");
          a.href = URL.createObjectURL(
            new Blob([JSON.stringify(out, null, 1)], {
              type: "application/json",
            }),
          );
          a.download = "shell-stock-backup-" + today() + ".json";
          a.click();
          toast("Backup downloaded ✓");
        } catch (e) {
          toast("Backup failed: " + e.message);
        }
        b.disabled = false;
        b.textContent = "⬇ Download full backup";
      }

          "stock_entries",
          "par_levels",
          "toilet_checks",

          "app_errors",
          "pin_requests",
          "profiles",
        ]) {
          const { error } = await sb.from(t).select("*").limit(1);
          add("Table: " + t, !error, error && error.message);

        for (const [fn, args] of [
          ["stock_as_of", { p_day: today() }],
          ["login_roster", {}],
          ["void_toilet_check", { p_id: -1, p_reason: "" }],

            missing =
              error &&
              /could not find|does not exist|schema cache/i.test(error.message);

            "Edge function: " + fn,

            error ? error.message : "no reply",

      /* ---------- number picker (scroll wheel) ---------- */
      let PK = null;
      const WH = Array.from({ length: 301 }, (_, k) => String(k)),
        FR = [".0", ".5"];
      function wheel(el, vals, idx, onch) {
        el.innerHTML = vals
          .map((v, i) => `<div data-i="${i}">${v}</div>`)
          .join("");
        el.scrollTop = idx * 44;
        let t;
        const mark = () => {
          const i = Math.max(
            0,
            Math.min(vals.length - 1, Math.round(el.scrollTop / 44)),
          );
          [...el.children].forEach((c, j) => c.classList.toggle("on", j === i));
        };
        mark();
        el.onscroll = () => {
          mark();
          clearTimeout(t);
          t = setTimeout(onch, 100);
        };
        el.onclick = (e) => {
          const d = e.target.closest("div[data-i]");
          if (d) el.scrollTo({ top: d.dataset.i * 44, behavior: "smooth" });
        };
      }
      function fromWheels() {
        if (!PK || PK.lock) return;
        const w = Math.min(300, Math.round($("#w1").scrollTop / 44)),
          f = Math.round($("#w2").scrollTop / 44),
          v = w + (f ? 0.5 : 0);
        $("#shi").value = String(v);
        $("#shv").textContent = v;
      }
      function openPicker(id, f) {
        const i = ITEMS.find((x) => x.id === id),
          pv = f === "waste" ? undefined : (S.prev[id] || {})[f];
        let v = parseFloat(R(id)[f]);
        if (isNaN(v)) v = parseFloat(pv);
        if (isNaN(v)) v = 0;
        PK = { id, f, lock: true };
        $("#sht").textContent =
          i.name +
          " · " +
          {
            cooked: "Cooked / Defrosted",
            raw: "Live / Raw / Frozen",
            waste: "Dead / waste",
          }[f] +
          " (" +
          (f === "raw" ? U(i, "ru") : U(i, "pu")) +
          ")" +
          (has(pv) ? " · was " + pv : "");
        $("#shb").hidden = false;
        $("#shi").value = String(v);
        $("#shv").textContent = v;
        wheel($("#w1"), WH, Math.min(300, Math.floor(v)), fromWheels);
        wheel(
          $("#w2"),
          FR,
          Math.abs(v - Math.floor(v) - 0.5) < 1e-9 ? 1 : 0,
          fromWheels,
        );
        setTimeout(() => {
          if (PK) PK.lock = false;
        }, 250);
      }
      const closePicker = () => {
        $("#shb").hidden = true;
        PK = null;
      };
      $("#shi").oninput = (e) => {
        if (!PK) return;
        const v = parseFloat(e.target.value.replace(",", "."));
        if (isNaN(v)) {
          $("#shv").textContent = "–";

        }
        $("#shv").textContent = v;
        PK.lock = true;
        $("#w1").scrollTop = Math.min(300, Math.floor(v)) * 44;
        $("#w2").scrollTop =
          (Math.abs(v - Math.floor(v) - 0.5) < 1e-9 ? 1 : 0) * 44;
        setTimeout(() => {
          if (PK) PK.lock = false;
        }, 300);
      };

        );
        const [par] = await Promise.all([
          q(sb.from("par_levels").select("*")),
          loadItems(),
          loadCfg(),
        ]);
        par.forEach((r) => (PAR[r.item_id] = { c: r.cooked, r: r.raw }));
        S.date = today();
        $("#login").hidden = true;
        head();
        $("#date").max = today();
        $("#date").min = p.role === "staff" ? today() : "";
        await openDay(S.date);
        go(S.force ? "pin" : "home");
        sb.channel("stock")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "stock_entries" },
            (pl) => {
              const r = pl.new;
              if (
                !r ||
                !r.item_id ||
                r.day !== S.date ||
                isDirty(r.item_id) ||
                document.activeElement?.closest(".card")?.dataset.id ===
                  r.item_id
              )
                return;
              S.day.items[r.item_id] = fromRow(r, S.date);
              S.tab === "check" ? rep(r.item_id) : stats();
            },
          )
          .subscribe();
      }
      $("#out").onclick = async () => {
        if (
          pending() &&
          !confirm(
            "You have unsaved changes (kept on this phone). Sign out anyway?",
          )
        )
          return;
        await sb.auth.signOut();
        location.reload();
      };
      $("#th").onclick = () => {
        const d = document.documentElement,
          dark =
            d.dataset.theme === "dark" ||
            (!d.dataset.theme &&
              matchMedia("(prefers-color-scheme:dark)").matches);
        d.dataset.theme = dark ? "light" : "dark";
        try {
          localStorage.setItem("sq:theme", d.dataset.theme);
        } catch (e) {}
      };
      try {
        const t = localStorage.getItem("sq:theme");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}

      /* ---------- signal / install ---------- */
      const net = () => {
        $("#net").hidden = navigator.onLine;
      };
      addEventListener("online", () => {
        net();
        if (S.user && pending())
          saveAll(true).then((ok) => ok && toast("Back online — saved ✓"));
      });
      addEventListener("offline", net);
      net();
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("sw.js").catch(() => {});
      document
        .querySelectorAll(".ver")
        .forEach((e) => (e.textContent = "v" + APP_VERSION));
      $("#date").value = S.date;
      sb.auth
        .getSession()
        .then(({ data }) =>
          data.session ? afterAuth(data.session) : showLogin(),
        );
    </script>
  </body>
</html>
